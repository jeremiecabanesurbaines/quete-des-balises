<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Défi D - Accueil</title>
    <!-- Importation de la police Poppins depuis Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #8BE0A4;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            color: #333;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.5rem;
            margin: 10px 0 30px 0;
        }
        p {
            font-size: 1.2rem;
        }
        /* Styles pour la barre de progression */
        .progress-container {
            margin-top: 50px;
        }
        .progress-text {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            max-width: 300px;
            margin: 0 auto;
        }
        .progress-line {
            position: absolute;
            top: 50%;
            left: 15px;
            right: 15px;
            border-top: 2px dashed #333;
            z-index: 1;
            transform: translateY(-50%);
        }
        .progress-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 2;
        }
        .progress-circle.active {
            background-color: #28a745; /* Vert */
        }
    </style>
</head>
<body>
    <img src="defi-D-noir.png" alt="Logo Défi D" class="logo">
    <h2>Thème du défi « Transition écologiques »</h2>
    
    <p>Recherchez la balise n°5 puis répondez à sa question.</p>

    <!-- Visuel d'avancement -->
    <div class="progress-container">
        <div class="progress-text">Progression dans le défi</div>
        <div class="progress-bar">
            <div class="progress-line"></div>
            <div class="progress-circle active">1</div>
            <div class="progress-circle">2</div>
            <div class="progress-circle">3</div>
            <div class="progress-circle">4</div>
            <div class="progress-circle">5</div>
            <div class="progress-circle">6</div>
        </div>
    </div>
</body>
</html>
