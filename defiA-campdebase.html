<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Défi A - Balise N°3</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F9E1A8;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            color: #333;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 30px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 12px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            width: 80%;
            max-width: 300px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        button {
            padding: 10px 25px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #555;
        }
        #success-message {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #ffffff;
            color: #155724;
            border: 2px solid #28a745;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <img src="defi-A-noir.png" alt="Logo Défi A" class="logo">
    <p>Question : "Je suis le seul continent qui s'étend sur les 4 hémisphères de la planète (Nord, Sud, Est, Ouest). Qui suis-je ?"</p>
    
    <div>
        <input type="text" id="answer" placeholder="Ma réponse">
        <button onclick="verifierReponse()">Valider</button>
    </div>

    <div id="success-message">
        Bravo ! Cherchez la balise N°8. Code d'accès : 4512.
    </div>

    <script>
        function verifierReponse() {
            // Récupère la valeur saisie, la passe en minuscules, retire les accents et les espaces superflus
            let saisie = document.getElementById('answer').value;
            let saisieNormalisee = saisie.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
            
            if (saisieNormalisee === "afrique") {
                document.getElementById('success-message').style.display = 'block';
            } else {
                alert("Mauvaise réponse, essayez encore !");
                document.getElementById('success-message').style.display = 'none';
            }
        }
    </script>
</body>
</html>
