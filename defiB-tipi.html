<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Défi B - Balise N°1</title>
    <!-- Importation de la police Poppins depuis Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #DCCCEC;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            color: #333;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.5rem;
            margin: 10px 0 30px 0;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 12px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            width: 80%;
            max-width: 300px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        button {
            padding: 10px 25px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #555;
        }
        #success-message {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #ffffff;
            color: #155724;
            border: 2px solid #28a745;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        /* Styles pour la barre de progression */
        .progress-container {
            margin-top: 50px;
        }
        .progress-text {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            max-width: 300px;
            margin: 0 auto;
        }
        .progress-line {
            position: absolute;
            top: 50%;
            left: 15px;
            right: 15px;
            border-top: 2px dashed #333;
            z-index: 1;
            transform: translateY(-50%);
        }
        .progress-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 2;
        }
        .progress-circle.active {
            background-color: #28a745; /* Vert */
        }
    </style>
</head>
<body>
    <img src="defi-B-noir.png" alt="Logo Défi B" class="logo">
    <h2>Thème du défi « Femmes célèbres »</h2>
    
    <p>En 1955, j'ai refusé de céder ma place dans un bus, déclenchant un mouvement majeur pour les droits civiques aux États-Unis. Quel est mon nom de famille ?</p>
    
    <div>
        <input type="text" id="answer" placeholder="Ma réponse">
        <button type="button" onclick="verifierReponse()">Valider</button>
    </div>

    <div id="success-message">
        Bravo ! Cherchez la balise N°11. Code d'accès : 3340
    </div>

    <!-- Visuel d'avancement -->
    <div class="progress-container">
        <div class="progress-text">Progression dans le défi</div>
        <div class="progress-bar">
            <div class="progress-line"></div>
            <div class="progress-circle">1</div>
            <div class="progress-circle active">2</div>
            <div class="progress-circle">3</div>
            <div class="progress-circle">4</div>
            <div class="progress-circle">5</div>
            <div class="progress-circle">6</div>
        </div>
    </div>

    <script>
        function verifierReponse() {
            let saisie = document.getElementById('answer').value;
            let saisieNormalisee = saisie.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
            
            if (saisieNormalisee === "parks") {
                document.getElementById('success-message').style.display = 'block';
            } else {
                alert("Mauvaise réponse, essayez encore !");
                document.getElementById('success-message').style.display = 'none';
            }
        }
    </script>
</body>
</html>
